# Text passed between my own devices, for /paste/.
# See README.md.
name = "paste"
main = "src/index.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "paste.szymon-wilczek.me", custom_domain = true }]

[vars]
ORIGINS = "https://szymon-wilczek.me,http://localhost:4321"

# from `npx wrangler kv namespace create PASTES`
[[kv_namespaces]]
binding = "PASTES"
id = "7c09f8739ef04d6a80af41d1979f2468"

# writes per address, wrong words included
[[ratelimits]]
name = "WRITES"
namespace_id = "1031"
simple = { limit = 10, period = 60 }
